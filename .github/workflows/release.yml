name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - run: scripts/build-app.sh build
      - run: test "$(build/CalFeed.app/Contents/MacOS/CalFeed --version)" = "CalFeed $(cat VERSION)"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
